# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  pull_request:
  push:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm pack --dry-run

  ios-example:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: example
      - run: npm run prebuild
        working-directory: example
      - run: xcodebuild -workspace ios/basic.xcworkspace -scheme basic -sdk iphonesimulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
        working-directory: example
      - run: xcodebuild -workspace ios/basic.xcworkspace -scheme basic -sdk iphonesimulator -configuration Release build CODE_SIGNING_ALLOWED=NO
        working-directory: example

  publish-npm:
    needs: [build, ios-example]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
